<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Perpustakaan</title>
    <style>
        body { font-family: sans-serif; margin: 24px; }
        .kolom { display: flex; gap: 40px; flex-wrap: wrap; }
        .kolom > section { flex: 1; min-width: 360px; }
        table { border-collapse: collapse; width: 100%; margin: 8px 0; }
        th, td { border: 1px solid #999; padding: 4px 8px; text-align: left; }
    </style>
</head>
<body>
<h1>Perpustakaan</h1>
<p th:if="${sukses}" th:text="${sukses}" style="color:green"></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>

<div style="margin-bottom: 20px;">
    <a th:href="@{/pinjam}">
        <button type="button">Peminjaman Buku</button>
    </a>
</div>

<div class="kolom">
    <section>
        <h2>Buku</h2>
        <form th:action="@{/}" method="get">
            <input name="kataBuku" th:value="${kataBuku}" placeholder="Cari judul">
            <input type="hidden" name="kataAnggota" th:value="${kataAnggota}">
            <button type="submit">Cari</button>
        </form>
        <table>
            <tr><th>ID</th><th>Judul</th><th>Stok</th></tr>
            <tr th:each="b : ${daftarBuku}">
                <td th:text="${b.idBuku}"></td>
                <td th:text="${b.judul}"></td>
                <td th:text="${b.stok}"></td>
            </tr>
        </table>
        <h3>Tambah Buku</h3>
        <form th:action="@{/buku}" method="post">
            <input name="idBuku" placeholder="ID" maxlength="10" required>
            <input name="judul" placeholder="Judul" maxlength="200" required>
            <input name="stok" type="number" min="0" value="1">
            <button type="submit">Simpan</button>
        </form>
    </section>

    <section>
        <h2>Anggota</h2>
        <form th:action="@{/}" method="get">
            <input name="kataAnggota" th:value="${kataAnggota}" placeholder="Cari nama">
            <input type="hidden" name="kataBuku" th:value="${kataBuku}">
            <button type="submit">Cari</button>
        </form>
        <table>
            <tr><th>ID</th><th>Nama</th><th>Email</th></tr>
            <tr th:each="a : ${daftarAnggota}">
                <td th:text="${a.idAnggota}"></td>
                <td th:text="${a.nama}"></td>
                <td th:text="${a.email}"></td>
            </tr>
        </table>
        <h3>Tambah Anggota</h3>
        <form th:action="@{/anggota}" method="post">
            <input name="idAnggota" placeholder="ID" maxlength="10" required>
            <input name="nama" placeholder="Nama" maxlength="100" required>
            <input name="email" type="email" placeholder="Email" maxlength="100">
            <button type="submit">Simpan</button>
        </form>
    </section>
</div>
</body>
</html>
