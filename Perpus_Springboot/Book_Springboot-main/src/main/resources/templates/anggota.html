<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Daftar Anggota</title>
</head>
<body>
<nav><a th:href="@{/buku}">Buku</a> | <a th:href="@{/anggota}">Anggota</a></nav>
<p th:if="${sukses}" th:text="${sukses}" style="color:green"></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>
<h1>Daftar Anggota</h1>

<form th:action="@{/anggota}" method="get">
    <input name="kata" th:value="${kata}" placeholder="Cari nama">
    <button type="submit">Cari</button>
</form>

<table border="1">
    <tr><th>ID</th><th>Nama</th><th>Email</th></tr>
    <tr th:each="a : ${daftarAnggota}">
        <td th:text="${a.idAnggota}">A001</td>
        <td th:text="${a.nama}">Nama anggota</td>
        <td th:text="${a.email}">email@contoh.com</td>
    </tr>
</table>

<h2>Tambah Anggota</h2>
<form th:action="@{/anggota}" method="post">
    <input name="idAnggota" placeholder="ID" maxlength="10" required>
    <input name="nama" placeholder="Nama" maxlength="100" required>
    <input name="email" type="email" placeholder="Email" maxlength="100">
    <button type="submit">Simpan</button>
</form>
</body>
</html>
